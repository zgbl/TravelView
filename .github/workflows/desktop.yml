# 桌面端打包 —— macOS 和 Windows 各出一个能直接安装的包。
#
# **两个用途:**
#   1. 手边只有一台机器时（比如带着 Mac 在外面），照样能出 Windows 包
#   2. 出包这件事不再依赖"某台机器上装对了东西"
#
# 什么时候跑:
#   - 推一个 v 开头的 tag（v0.1.0）  -> 出包 + 建 GitHub Release
#   - 在 Actions 页面手点 Run        -> 只出包，挂在这次运行下面
#   - 改了桌面端代码推上来           -> 只编译，验证没编坏（不出包，省时间）
name: Desktop build

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'apps/tv_desktop/**'
      - 'packages/tv_core/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:        # 手动触发

env:
  # **锁死版本。** 用 'stable' 会让某天 Flutter 发新版时构建突然坏掉，
  # 而你根本没改过代码 —— 那种问题最难查
  FLUTTER_VERSION: '3.35.5'

jobs:
  macos:
    runs-on: macos-14        # M1，和你的 iMac 同架构
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true        # 缓存 SDK，第二次起快很多

      - name: 依赖
        working-directory: apps/tv_desktop
        run: flutter pub get

      - name: 静态检查
        working-directory: apps/tv_desktop
        # 不让它挡住出包 —— analyze 的告警和"能不能装"是两件事
        run: flutter analyze || true

      - name: 编译
        working-directory: apps/tv_desktop
        run: flutter build macos --release

      - name: 打 DMG
        working-directory: apps/tv_desktop
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/TravelView.app"
          VERSION=$(grep '^version:' pubspec.yaml | head -1 \
            | sed 's/version: *//' | cut -d+ -f1)
          # ad-hoc 签名: Apple Silicon 上完全没签名的 app 会被系统直接杀掉，
          # 提示是"已损坏"，看起来像构建坏了，其实不是
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname TravelView -srcfolder "$STAGE" \
            -ov -format UDZO "dist/TravelView-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: TravelView-macos
          path: apps/tv_desktop/dist/*.dmg
          retention-days: 30

  windows:
    # **钉死镜像，不用 windows-latest。**
    # latest 已经指向 Server 2025，Flutter 在那上面探测 Visual Studio 时
    # 挑了 "Visual Studio 16 2019" 的生成器，而镜像里装的是 2022，
    # CMake 于是报 "could not find any instance of Visual Studio"。
    # 这类错误看着像工具链没装，其实是版本探测错位
    runs-on: windows-2022      # 自带 Visual Studio 2022 + C++ 工具链
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 工具链信息
        # **构建之前先把环境打出来。** 出问题时这几行日志能直接定位，
        # 否则只能靠猜是 Flutter、CMake 还是 Visual Studio 的问题
        run: |
          flutter --version
          flutter doctor -v

      - name: 依赖
        working-directory: apps/tv_desktop
        run: flutter pub get

      - name: 编译
        working-directory: apps/tv_desktop
        run: flutter build windows --release

      - name: 打 zip
        working-directory: apps/tv_desktop
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:').Line `
                 -replace 'version:\s*','' -replace '\+.*',''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # **整个 Release 目录**: exe + flutter_windows.dll + data\，
          # 少一样就是双击没反应、也不报错
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\TravelView-$($v.Trim())-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: TravelView-windows
          path: apps/tv_desktop/dist/*.zip
          retention-days: 30

  # 只有推 tag 时才建 Release —— 平时每次 push 都建，Release 页面会被淹掉
  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 建 Release 要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 安装

            **macOS** — 打开 DMG，把 TravelView 拖进 Applications。
            第一次打开会被拦（没有 Apple 开发者签名）：
            **右键点图标 → 打开 → 再点「打开」**，只需要做这一次。

            **Windows** — 解压 zip 到任意目录，双击 `TravelView.exe`。
            SmartScreen 会拦一下：「更多信息」→「仍要运行」。
            zip 里每个文件都要留着，单独拷 exe 出来会打不开。

            > Windows 版目前只能验证界面 —— 读 EXIF/GPS、生成缩略图、
            > 导出网页图的原生实现还只有 macOS 那一份。
