name: tv_shared
description: TravelView 桌面端与手机端共用的应用层（界面语言 / 设置 / 草稿 / Story 导出 / 平台图像接口）
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tv_core:
    path: ../tv_core
  path: ^1.9.0
  # App 内阅读器的概览地图。两端本来就各自依赖同一个版本，
  # 阅读器搬到共享层，依赖也跟着搬过来
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
