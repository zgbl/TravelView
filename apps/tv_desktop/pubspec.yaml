name: tv_desktop
description: TravelView 桌面端 —— 照片库管理与旅行回顾生成
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tv_core:
    path: ../../packages/tv_core
  tv_shared:
    path: ../../packages/tv_shared
  file_selector: ^1.0.3
  path: ^1.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Windows 打包配置: flutter build windows --release && dart run msix:create
msix_config:
  display_name: TravelView
  publisher_display_name: TravelView
  identity_name: com.travelview.desktop
  msix_version: 0.1.0.0
  capabilities: removableStorage
