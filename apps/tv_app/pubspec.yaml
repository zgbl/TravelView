name: tv_app
description: TravelView 手机端 —— 从相册里长出旅行回顾
publish_to: none
version: 0.6.1+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tv_core:
    path: ../../packages/tv_core
  tv_shared:
    path: ../../packages/tv_shared

  # 只读系统相册。**不复制照片** —— 手机上已经有一份了，
  # 再在沙盒里存一份等于凭空吃掉几十 GB。
  photo_manager: ^3.6.1

  # 单独申请 ACCESS_MEDIA_LOCATION 用。
  # Android 10+ 把照片的 GPS 当成独立的运行时权限，photo_manager 的权限请求
  # **不包含它** —— 只写进 manifest 的话，读到的每张照片都不带位置。
  permission_handler: ^11.3.1

  # 沙盒目录（设置、缩略图缓存、导出产物）
  path_provider: ^2.1.4
  path: ^1.9.0

  # 分享弹窗里的二维码
  qr_flutter: ^4.1.0

  # 版本号显示在个人中心
  package_info_plus: ^8.1.1

  # 在系统浏览器里打开自己发布的故事
  url_launcher: ^6.3.1

  # 地图与分享
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.1.2

  # 让用户挑一首配乐。**用系统的文档选择器，不要自己写一个音频浏览器** ——
  # 那等于在 App 里再做一个文件管理器，还要处理音乐 App 的沙盒。
  # 和桌面端同一个包，两端的 XTypeGroup 写法只差平台那几种类型标识。
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
