# TravelView 应用本体 —— 被 nginx-travelview.conf 里的 443 server 块 include。
#
# 为什么要单独一个文件: 新老域名各用各自的证书，就得是两个 server 块；
# 应用部分（缓存、反代、Stripe 那条不许改写 body 的规矩）只写一份，
# 免得以后改了一处忘了另一处。

# 发布时一张图一个 PUT，默认的 1M 会把上传打回来
client_max_body_size 12m;

access_log /var/log/nginx/travelview.access.log;
error_log  /var/log/nginx/travelview.error.log;

# 发布出去的图片: nginx 直接从磁盘发，不经过 Node。
# 图片一旦发布就不再变，所以可以给足缓存。
location /media/ {
    alias /var/lib/travelview/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# 老域名上的「账号类页面」统一并到正式域名。
#
# 为什么: Auth.js 只认一个 AUTH_URL（= https://yourtravelview.com），
# 在老域名上登录时它会把你跳到正式域名，可会话 cookie 是发给老域名的 ——
# 结果是"登了像没登"。与其让人在旧域名上白登一次，不如这些页面直接并过去。
#
# 只并页面，不动 /api/、/media/、/s/、/u/ ——
# 已发出去的公开分享页和图片、以及桌面端调接口，在旧域名上照常可用。
# 注意: 这里的 proxy_* 指令要和下面 location / 保持一致。
location ~ ^/(login|signup|account|admin|stories|link)(/|$) {
    if ($host = travelview.blackrice.top) {
        return 301 https://yourtravelview.com$request_uri;
    }
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
}

# Next.js 的静态产物同样可以长缓存（文件名带哈希）
location /_next/static/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    # Host 原样传下去: 应用要按它决定公开链接/跳转落在哪个域
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Stripe webhook 靠原始请求体验签 —— 这里绝不能改写 body
    proxy_request_buffering off;
}
