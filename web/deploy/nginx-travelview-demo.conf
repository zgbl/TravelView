# TravelView 演示站 —— demo.yourtravelview.com 的 nginx 站点配置
#
# ─────────────────────────────────────────────────────────────────────────
# 【这份文件是**线上文件的逐行副本**，不是设计稿】
#
# 线上位置: ubuntu@193.122.150.15（OCI，hostname `instance-20260925-cf-demo`）
#           /etc/nginx/sites-available/demo.yourtravelview.com
#           /etc/nginx/sites-enabled/demo.yourtravelview.com -> 上面那个
# 比对时间: 2026-09-26（内容一致）
#
# 部署方式:
#   scp web/deploy/nginx-travelview-demo.conf \
#       ubuntu@193.122.150.15:/tmp/demo.conf
#   sudo install -m 644 -o root -g root /tmp/demo.conf \
#        /etc/nginx/sites-available/demo.yourtravelview.com
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────
#
# ⚠ 这是**独立的一台机器**，别和生产机 129.80.4.27 的
#   /etc/nginx/sites-available/travelview 互相抄：
#
#   - 生产机 `129.80.4.27` 上没有、也不该有 demo 的 server 块
#     （2026-09-26 `sudo nginx -T | grep server_name` 确认过）。
#   - 这台机器上**不存在** `/etc/nginx/snippets/travelview-app.conf`
#     （只有 Ubuntu 自带的 fastcgi-php.conf / snakeoil.conf）。
#     所以下面把「反代 3001 + /media/ 直发 + Stripe 不改写 body」这段
#     **直接内联写全**了，不是 include。照抄生产机那份带 include 的写法
#     → `nginx -t` 会因找不到文件直接失败。
#
# ─────────────────────────────────────────────────────────────────────────
# 证书：这里必须用 Let's Encrypt，不能搬生产机那套 Cloudflare Origin CA
#
# 演示站目前是 **DNS-only（灰云）**：`dig demo.yourtravelview.com` 只回
# 193.122.150.15，访客直连源站、不经过 Cloudflare（响应头是 `server: nginx`，
# 没有 cf-ray）。所以访客那一段的证书得由这台机器自己出，且必须是浏览器
# 信任的公共 CA。
#
# Cloudflare **Origin CA 证书只有 Cloudflare 认**，浏览器不认。搬过来就是：
#   地址栏 "Not Secure"（Chrome）
#   DevTools → Security: "This page isn't secure (broken HTTPS)."
#                        Resources - active content with certificate errors
#                        "You have recently allowed content loaded with
#                         certificate errors (such as scripts or iframes) …"
#
# —— 即 2026-09-26 早上那次故障。当时这台机器还没有 demo 自己的证书，
# nginx 对该 SNI 回落到唯一一个 443 server 块（也就是本文件）的证书，
# 名字对不上 → 整站 broken HTTPS。当天签发 demo 自己的 Let's Encrypt 证书后恢复。
#
# ⚠ **下面第 2 行注释说"橙云 Proxied / Full (strict)"，与实测不符**（实测是灰云）。
#   两种模式下本文件都能工作（LE 证书对两种模式都有效），所以先保持原样没动，
#   但**请确认这块 A 记录到底想用哪种模式**，见 runbook §9.5。
#
# 续期（已确认可用）: certbot webroot，`/var/www/certbot`，`certbot.timer` 在跑。
#   sudo certbot renew --dry-run
#
# ⚠ 光续期不够 —— nginx 只在启动/reload 时把证书读进内存，磁盘换了它不会自动重读。
#   这台机器上已经装了 deploy hook（2026-09-26）:
#     /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh   ->  systemctl reload nginx
#   换机器/重装时**这个文件必须一起补上**，否则 certbot 会"续期成功"而 nginx
#   继续发旧证书，直到旧证书过期 → 整站 broken HTTPS（正是本项目踩过的坑）。
#
# ─────────────────────────────────────────────────────────────────────────

# ── TravelView origin server (Cloudflare Application Services Assignment) ──
# 域名:      demo.yourtravelview.com  (Cloudflare 橙云 Proxied)
# 回源加密:  Full (strict)，Cloudflare → origin 走 443
# 证书:      /etc/letsencrypt/live/demo.yourtravelview.com/{fullchain,privkey}.pem  —— 由 Let's Encrypt 签发（非 Cloudflare 签发）
#
# ⚠ 上游端口只在这一处定义。改端口只改这一行。
upstream travelview_app {
    server 127.0.0.1:3001;
}

# HTTP 一律升到 HTTPS。Cloudflare 侧也会跳，这里是给直连兜底。
#server {
#    listen 80;
#    listen [::]:80;
#    server_name demo.yourtravelview.com;
#    return 301 https://$host$request_uri;
#}

server {
    listen 80;
    listen [::]:80;
    server_name demo.yourtravelview.com;

    # ⚠ 301 必须包在 location / 里，不能写成 server 级的 return 301。
    # nginx 的 server 级 return 在 server-rewrite 阶段执行，早于 location 匹配，
    # 会让下面这条 ACME 验证路径永远走不到 —— 2026-09-26 在本机实测确认过：
    # server 级 return 会把 /.well-known/acme-challenge/xxx 也 301 走；
    # 包进 location / 之后该路径正常 200。
    # 后果是首次签发成功、但 90 天后自动续期静默失败，站点再次 broken HTTPS。
    #
    # root 用 /var/www/certbot（不是 /var/www/html），必须和
    # /etc/letsencrypt/renewal/demo.yourtravelview.com.conf 里的
    # webroot_map 保持一致。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 注: Ubuntu 自带 nginx 1.24 不支持独立的 "http2 on;" 指令，只能写在 listen 上
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.yourtravelview.com;

    ssl_certificate     /etc/letsencrypt/live/demo.yourtravelview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.yourtravelview.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── HSTS: 目前没开，建议先别开 ──
    # 这台机器刚因为证书缺失整站 broken HTTPS 过。HSTS 一旦下发到浏览器，
    # 证书再出问题访客连"继续访问"都没有，只能去清 HSTS 缓存。
    # 等 certbot 自动续期跑过至少一个周期（约 90 天）确认稳了再考虑。
    # 真要开也别加 includeSubDomains —— yourtravelview.com 走 Cloudflare，
    # 策略该分开定，别用一个观察期的站替主站做主。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 发布时一张图一个 PUT，默认的 1M 会把上传打回来
    client_max_body_size 12m;

    access_log /var/log/nginx/travelview.access.log;
    error_log  /var/log/nginx/travelview.error.log;

    # 发布出去的图片: nginx 直接从磁盘发，不经过 Node。
    # 图片一旦发布就不再变，所以可以给足缓存。
    location /media/ {
        alias /var/lib/travelview/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Next.js 的静态产物同样可以长缓存（文件名带哈希）
    location /_next/static/ {
        proxy_pass http://travelview_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://travelview_app;
        proxy_http_version 1.1;
        # Host 原样传下去: 应用要按它决定公开链接/跳转落在哪个域
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Stripe webhook 靠原始请求体验签 —— 这里绝不能改写 body
        proxy_request_buffering off;
    }
}

# ── 已知遗留项 ──
#
# 1) 443 的默认 server 就是本文件这一段：这台机器上**只有这一个 443 server 块**
#    （/etc/nginx/sites-available/default 里两个 443 listen 都是注释掉的），
#    所以任意不存在的 SNI 连 193.122.150.15:443 都会拿到 demo 的证书和内容。
#    要收口，可在 default 站点里启用一个 `listen 443 ssl default_server;`
#    并 `return 444;`。**本次没做**：这属于「这台机器还想不想服务别的域名」的
#    产品决定，不该顺手改。
#
# 2) 第 2 行注释写的"橙云 Proxied / Full (strict)"与实测的灰云不符，见文件头。
