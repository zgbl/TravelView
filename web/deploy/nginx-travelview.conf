# TravelView —— 和 TensuGo 共用这台 nginx，各自一个 server 块互不影响。
#
# Cloudflare 是橙云（Proxied），所以到访客那一段的证书是 Cloudflare 的；
# 这里装的是 Cloudflare Origin CA 证书（15 年有效，只有 CF 会连它），
# CF 的 SSL 模式要设成 Full (strict)。
# 不走 CF 的话，把证书路径换成 certbot 签的即可。

server {
    listen 80;
    listen [::]:80;
    server_name travelview.blackrice.top;
    return 301 https://$host$request_uri;
}

server {
    # 注: Ubuntu 自带 nginx 1.24 不支持独立的 "http2 on;" 指令，要在 listen 上加 http2
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name travelview.blackrice.top;

    ssl_certificate     /etc/ssl/travelview/origin.pem;
    ssl_certificate_key /etc/ssl/travelview/origin.key;

    # 发布时一张图一个 PUT，默认的 1M 会把上传打回来
    client_max_body_size 12m;

    access_log /var/log/nginx/travelview.access.log;
    error_log  /var/log/nginx/travelview.error.log;

    # 发布出去的图片: nginx 直接从磁盘发，不经过 Node。
    # 图片一旦发布就不再变，所以可以给足缓存。
    location /media/ {
        alias /var/lib/travelview/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Next.js 的静态产物同样可以长缓存（文件名带哈希）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Stripe webhook 靠原始请求体验签 —— 这里绝不能改写 body
        proxy_request_buffering off;
    }
}
