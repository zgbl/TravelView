# TravelView —— 和 TensuGo 共用这台 nginx，各自 server 块互不影响。
#
# 域名与证书（**两套证书各自独立，互不覆盖**）:
#   yourtravelview.com / www.yourtravelview.com   → /etc/ssl/travelview/yourtravelview_origin.{pem,key}
#                                                   SAN: *.yourtravelview.com, yourtravelview.com
#   travelview.blackrice.top                      → /etc/ssl/travelview/origin.{pem,key}（老的那对，别动）
#                                                   SAN: *.blackrice.top, blackrice.top
#
# 应用部分在 /etc/nginx/snippets/travelview-app.conf，两个 443 块共用一份。
#
# Cloudflare 是橙云（Proxied），访客那一段的证书由 CF 提供；这里装的是
# Cloudflare Origin CA 证书，只给 CF 回源用。CF 的加密模式要设成 Full (strict)，
# 每个域名用哪张证书由 SNI 决定 —— 所以上面两套证书缺一不可。

server {
    listen 80;
    listen [::]:80;
    server_name yourtravelview.com travelview.blackrice.top;
    return 301 https://$host$request_uri;
}

# www 一律并到裸域: http 一步跳到 https 裸域，不绕 www 那一跳
server {
    listen 80;
    listen [::]:80;
    server_name www.yourtravelview.com;
    return 301 https://yourtravelview.com$request_uri;
}

# www 的 https 也要接住（否则会掉到 TensuGo 的通配 server 块去）
server {
    # 注: Ubuntu 自带 nginx 1.24 不支持独立的 "http2 on;" 指令，要在 listen 上加 http2
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yourtravelview.com;

    ssl_certificate     /etc/ssl/travelview/yourtravelview_origin.pem;
    ssl_certificate_key /etc/ssl/travelview/yourtravelview_origin.key;

    return 301 https://yourtravelview.com$request_uri;
}

# 正式域名
server {
    # 注: Ubuntu 自带 nginx 1.24 不支持独立的 "http2 on;" 指令，要在 listen 上加 http2
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourtravelview.com;

    ssl_certificate     /etc/ssl/travelview/yourtravelview_origin.pem;
    ssl_certificate_key /etc/ssl/travelview/yourtravelview_origin.key;

    include /etc/nginx/snippets/travelview-app.conf;
}

# 老域名: 内容照常服务，账号类页面在 snippet 里 301 到正式域名
server {
    # 注: Ubuntu 自带 nginx 1.24 不支持独立的 "http2 on;" 指令，要在 listen 上加 http2
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name travelview.blackrice.top;

    ssl_certificate     /etc/ssl/travelview/origin.pem;
    ssl_certificate_key /etc/ssl/travelview/origin.key;

    include /etc/nginx/snippets/travelview-app.conf;
}
